
{% extends "base.html" %}
{% block title %} update user  {% endblock %}
{% block main %}

<div class="registration-form-section">
  <div class="container">
    <h2>Create a new post </h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save</button>
    </form>
  </div>
</div>

{% endblock %}
